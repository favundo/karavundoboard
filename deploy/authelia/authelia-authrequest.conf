###############################################################################
# /etc/nginx/snippets/authelia-authrequest.conf
#
# À inclure dans CHAQUE location protégée du vhost karinventaire01.
# Ne pas inclure dans « location = /internal/authelia/authz » (récursion).
###############################################################################

auth_request /internal/authelia/authz;

# Identité renvoyée par Authelia, capturée depuis la réponse de l'auth_request.
auth_request_set $target_url $scheme://$http_host$request_uri;
auth_request_set $user       $upstream_http_remote_user;
auth_request_set $groups     $upstream_http_remote_groups;
auth_request_set $name       $upstream_http_remote_name;
auth_request_set $email      $upstream_http_remote_email;

# …puis réécrite vers le backend.
#
# ⚠️  CE BLOC EST LA SÉCURITÉ. proxy_set_header ÉCRASE tout en-tête Remote-*
#     que le client aurait tenté d'envoyer lui-même. Sans lui, n'importe qui
#     peut se faire passer pour n'importe quel technicien en ajoutant un
#     en-tête « Remote-User: nehad » à sa requête.
proxy_set_header Remote-User   $user;
proxy_set_header Remote-Groups $groups;
proxy_set_header Remote-Name   $name;
proxy_set_header Remote-Email  $email;

# Session expirée → on renvoie au portail plutôt qu'un 401 nu.
# Le paramètre rd ramène l'utilisateur là où il était après connexion.
error_page 401 =302 https://auth.in.karavel.com/?rd=$target_url;
