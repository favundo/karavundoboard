###############################################################################
# Nginx — karavundoboard derrière Authelia
#
# À FUSIONNER avec le vhost existant, pas à copier tel quel : le serveur sert
# déjà le SPA sur /, PostgREST sur /rest/v1/ et l'API Express sur /api/.
# Seuls les blocs marqués « AJOUT » sont nouveaux.
###############################################################################

# ── AJOUT : le portail Authelia sur son propre sous-domaine ──────────────────
server {
    listen 443 ssl;
    server_name auth.in.karavel.com;

    # ssl_certificate / ssl_certificate_key : mêmes que le vhost principal

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name karinventaire01.in.karavel.com;

    # ── AJOUT : point de vérification interne appelé par auth_request ────────
    location = /internal/authelia/authz {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    # ── AJOUT : bloc commun à toutes les locations protégées ──────────────
    # Son contenu est dans authelia-authrequest.conf (à déposer dans
    # /etc/nginx/snippets/). Il capture l'identité renvoyée par Authelia et la
    # réécrit vers le backend en ÉCRASANT tout en-tête Remote-* venu du client.

    # ── Le SPA ──────────────────────────────────────────────────────────────
    location / {
        include /etc/nginx/snippets/authelia-authrequest.conf;   # AJOUT
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # ── L'API Express ───────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/authelia-authrequest.conf;   # AJOUT
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # ── PostgREST ───────────────────────────────────────────────────────────
    # ⚠️  NE PAS EXEMPTER CE BLOC. Les policies RLS sont toutes en USING (true)
    #     et la clé anon est lisible dans le bundle JS : sans auth_request ici,
    #     n'importe qui sur le réseau interne lit et écrit tous les inventaires
    #     sans passer par l'interface. C'est le seul endroit qui protège
    #     réellement les données.
    location /rest/v1/ {
        include /etc/nginx/snippets/authelia-authrequest.conf;   # AJOUT
        proxy_pass http://127.0.0.1:54321;   # ← port réel de votre Supabase/Kong
        proxy_set_header Host $host;
    }
}
