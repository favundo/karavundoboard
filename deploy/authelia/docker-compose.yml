# Authelia devant karavundoboard — à déployer sur karinventaire01.in.karavel.com
#
#   cd /opt/authelia && docker compose up -d
#
# Le conteneur n'est joignable que depuis la machine (127.0.0.1:9091) : c'est
# Nginx qui l'expose, jamais Docker directement.

services:
  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - ./configuration.yml:/config/configuration.yml:ro
      - authelia-data:/config
    environment:
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD", "authelia", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  authelia-data:
